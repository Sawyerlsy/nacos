name: Sync to Gitee
on:
  push:
    branches: [ main, master ]  # 监听分支（按需修改）
  release:
    types: [published]         # 监听 Release 发布事件

jobs:
  sync-code-and-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 获取完整历史（同步 Tags 必需）

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Add Gitee Remote
        run: git remote add gitee git@gitee.com:sawyerlsy/nacos.git  # 替换为你的 Gitee 仓库地址

      - name: Setup SSH Key
        env:
          PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push Code & Tags to Gitee
        run: |
          git push gitee --all --force  # 同步所有分支
          git push gitee --tags         # 同步所有标签（含 Release 标记）

  sync-release-assets:   # 同步 Release 附件（二进制/安装包）
    needs: sync-code-and-tags
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload to Gitee Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动生成的 Token
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}    # 需额外配置的 Gitee Token
        with:
          files: release-assets/*  # 匹配下载的附件
          repo: sawyerlsy/nacos    # Gitee 仓库名
          tag_name: ${{ github.ref_name }}  # 使用相同标签名
          target_commitish: main   # 关联的分支
