name: Sync All Branches & Releases to Gitee
on:
  push:
    branches: ['v2.2.3-localization']  # 监听所有分支的推送
  release:
    types: [published]  # 监听 Release 发布事件

jobs:
  sync-code-and-tags:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（含完整历史记录）
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整提交历史（同步 Tags 必需）[6](@ref)

      # 2. 配置 Git 身份
      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Sync"
          git config --global user.email "actions@users.noreply.github.com"

      # 3. 添加 Gitee 远程仓库
      - name: Add Gitee Remote
        run: git remote add gitee git@gitee.com:sawyerlsy/nacos.git  # 替换为你的 Gitee 仓库地址

      # 4. 配置 SSH 密钥（核心鉴权）
      - name: Setup SSH Key
        env:
          PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}  # 从 Secrets 获取私钥
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts  # 信任 Gitee 主机[1,6](@ref)

      # 5. 同步所有分支和标签
      - name: Push All Branches & Tags
        run: |
          git push gitee --all --force  # 强制同步所有分支
          git push gitee --tags         # 同步所有标签（含 Release 标记）[4](@ref)

  # 6. 同步 Release 附件（二进制/安装包等）
  sync-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # 关键权限
    steps:
      - name: Download Release Assets
        uses: actions/download-release-assets@v4  # 升级到 v4
        with:
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          path: release-assets

      # 上传到 Gitee Release
      - name: Upload to Gitee Release
        uses: wulijun/action-gitee-release@v1
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}  # Gitee 私人令牌
        with:
          tag: ${{ github.ref_name }}  # 使用相同标签名
          files: release-assets/*      # 匹配下载的附件
          repo: sawyerlsy/nacos        # Gitee 仓库名
          release_content: ${{ github.event.release.body }}  # 同步 Release 描述
